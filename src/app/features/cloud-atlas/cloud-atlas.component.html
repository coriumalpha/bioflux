<div class="atlas-wrapper">
  <div
    class="cloud"
    *ngFor="let cloud of clouds"
    [ngStyle]="{
      top: cloud.top,
      left: cloud.left,
      width: cloud.size,
      height: cloud.size,
      backgroundColor: cloud.color,
      animationDelay: cloud.delay,
      animationDuration: cloud.duration
    }"
  ></div>
</div>
